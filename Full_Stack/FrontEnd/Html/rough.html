<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rough practice</title>
<style>
body{
    background : linear-gradient(to right top , rgb(118, 129, 255), rgb(239, 173, 255));
}
.img,img{
    width : 500px;
    height : 250px;
    box-shadow: 2px 2px 2px rgb(90, 90, 90);
    margin : auto ;

}
.main{
    width : 500px;
    height : 700px;
    margin : auto;
}
p{
    box-shadow : 0px 0px 10px 2px black;
    font-size : 10px;
    padding : 5px;
    background : white;
    font-family :'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    column-count : 5;
    column-width : 100px;
    column-gap : 10px;
    column-rule : 3px double red;
}
.l1{
    width : 10px;
    height : 10px;
    border-radius : 100%;
    background-color: red;
    transform: translate(3px,67px);
    
    

}
.l2{
    width : 10px;
    height : 10px;
    border-radius : 100%;
    background-color: yellow;
    transform: translate(15px,57px);
}
.l3{
    width : 10px;
    height : 10px;
    border-radius : 100%;
    background-color: green;
    transform: translate(27px,47px);
}

.r1{
    width : 4px;
    height : 13px;
    background-color: white;
    transform: translate(490px,40px);
}
.r2{
    width : 3.8px;
    height : 10px;
    background-color: white;
    transform: translate(485px,30.2px);
}
.r3{
    width : 3.5px;
    height : 8px;
    background-color: white;
    transform: translate(480.5px,22.2px);
}
.r4{
    width : 3px;
    height : 4px;
    background-color: white;
    transform: translate(476.2px,18.4px);
}

</style>
</head>
<body>
    <div class="main">
        <!-- left side -->
        <div class="l1"></div>
        <div class="l2"></div>
        <div class="l3"></div>
        <!-- right side -->
        <div class="r1"></div>
        <div class="r2"></div>
        <div class="r3"></div>
        <div class="r4"></div>
        <!-- main screen image -->
        <div class="img"><img src="pic_01.webp" alt="rough" width="500px" height="200px"></div>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Similique eaque ut est illum saepe voluptate sint! Mollitia incidunt adipisci in soluta, beatae blanditiis commodi, quasi tempora nobis ducimus numquam minus.</p>
    </div>
</body>
</html>
