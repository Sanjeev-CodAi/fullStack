<html>
<head>
    <title>CSS Animation</title>
    <link rel="stylesheet" type="text/css" href="../css/css_Animation.css">
</head>
<body>
    <div class="anim-timing-func">
        <div class="linear">Animation timing function - Linear
            <div class="anim-func-box-linear"></div> </div>
        <div class="ease">Animation timing function - Ease
            <div class="anim-func-box-ease"></div> </div>

            <div class="anim-func-box-ease-in"></div> </div>

        <div class="Ease-in-out">Animation timing function - Ease-in-out
            <div class="anim-func-box-ease-in-out"></div> </div>

    <div class="container">
        <div class="box"></div>
